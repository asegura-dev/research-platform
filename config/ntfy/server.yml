# Installed as /srv/ntfy/server.yml (docs/guides/install-ntfy.md).
# It holds no instance values: users, passwords and tokens live in the
# database under /srv/ntfy/data, which only root can read.

# Inside its container. Docker publishes it on 127.0.0.1:2586 only, and
# Tailscale Serve forwards each connection from the tailnet over TCP, without
# naming the device it comes from. ntfy counts every device as one visitor,
# well within its limits (ADR-014), and behind-proxy stays off: on, it would
# take whatever address a client claims.
listen-http: ":80"

# Messages wait 48 hours for a phone that was off or out of the tailnet.
cache-file: /var/lib/ntfy/cache.db
cache-duration: "48h"

# Nobody reads or publishes without a user that has access to the topic.
auth-file: /var/lib/ntfy/user.db
auth-default-access: deny-all

# The phone's app is the only client: no web app, no sign-up, no attachments.
web-root: disable
